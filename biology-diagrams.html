<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Biology Diagram Lab | MMP</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#3a1f0b;--mut:#8a6a52;--acc:#ea580c;--line:#fde0c5;--ok:#15803d;--no:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#1a1410;--card:#241c16;--ink:#f5e9df;--mut:#b9a392;--acc:#fb923c;--line:#3a2d23}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:linear-gradient(90deg,#ea580c,#f59e0b);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
a.btn,button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:16px;margin-top:4px}
@media(max-width:760px){.stage{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}
.part{cursor:pointer}
.part:hover{filter:brightness(1.1)}
.part.hl{filter:drop-shadow(0 0 4px #ea580c) drop-shadow(0 0 8px #ea580c);animation:pul 1s infinite alternate}
@keyframes pul{to{filter:drop-shadow(0 0 1px #ea580c)}}
.quiz .part{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mut{color:var(--mut);font-size:13px}
.info h3{margin:0 0 6px}
.q{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--no);color:#fff;border-color:var(--no)}
.fb{padding:8px 10px;border-radius:8px;margin:8px 0;color:#fff;font-weight:600}
footer{padding:14px;text-align:center;font-size:13px;color:var(--mut);border-top:1px solid var(--line);background:var(--card)}
footer a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>NEET Biology Diagram Lab</h1>
  <a class="btn" href="dashboard.html">&larr; Topic Navigator</a>
</header>

<main>
  <div class="row" id="dtabs"></div>
  <div class="row">
    <button id="mLearn" class="on">Learn: tap the parts</button>
    <button id="mQuiz">Quiz: name the part</button>
    <label class="mut"><input type="checkbox" id="mix"> Mix all diagrams (quiz)</label>
    <span id="score" class="mut"></span>
  </div>
  <div class="panel">
    <div class="mut" id="chap"></div>
    <div class="stage" id="stage">
      <div id="svgbox"></div>
      <div class="info" id="side"></div>
    </div>
  </div>
</main>

<footer>
  Author: <b>Kaushal.J</b> &middot; JEE Advanced / NEET Trainer &middot;
  <a href="https://git-kaushal.github.io/MMP/">https://git-kaushal.github.io/MMP/</a>
  <div style="margin-top:4px">These are simplified, original schematic drawings for practice. Always check proportions and labelling against your NCERT figures.</div>
</footer>

const hRot = (n, f) => [...Array(n)].map((_, k) => `<g transform="rotate(${k * 360 / n} 150 150)">${f}</g>`).join("");
const hM2 = (s, w) => s + `<g transform="translate(${w || 300} 0) scale(-1 1)">${s}</g>`;
const hPol = (a, r) => [150 + r * Math.sin(a * Math.PI / 180), 150 - r * Math.cos(a * Math.PI / 180)];
const hF = n => n.toFixed(1);
const hArc = (a1, a2, r, c, w) => { const p = hPol(a1, r), q = hPol(a2, r), big = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `<path d="M${hF(p[0])} ${hF(p[1])}A${r} ${r} 0 ${big} 1 ${hF(q[0])} ${hF(q[1])}" fill="none" stroke="${c}" stroke-width="${w}"/>`; };
const hTick = a => { const p = hPol(a, 76), q = hPol(a, 106), d = `M${hF(p[0])} ${hF(p[1])}L${hF(q[0])} ${hF(q[1])}`;
  return `<path d="${d}" stroke="#111" stroke-width="4"/><path d="${d}" stroke="rgba(0,0,0,0)" stroke-width="16"/>`; };
const hLip = (x, top) => { const h = top ? 60 : 140, a = top ? 68 : 132, b = top ? 98 : 102;
  return {h: `<circle cx="${x}" cy="${h}" r="7" fill="#fcd34d" stroke="#b45309"/>`, t: `<path d="M${x - 3} ${a}V${b}M${x + 3} ${a}V${b}" stroke="#a16207" stroke-width="2" fill="none"/>`}; };
const hLips = [...Array(15)].flatMap((_, i) => [hLip(18 + i * 20, true), hLip(18 + i * 20, false)]);

<g class="part" data-p="fov"><circle cx="249" cy="130" r="5" fill="#dc2626"/></g>
<g class="part" data-p="bs"><circle cx="241" cy="163" r="6" fill="#fde047" stroke="#a16207" stroke-width="2"/></g>`,
parts:[
["sc","Sclera","Tough, white outer coat; continues in front as the transparent cornea."],
["co","Cornea","Transparent front part of the outer coat; bends most of the incoming light."],
["ch","Choroid","Middle, pigmented coat rich in blood vessels; thickens in front to form the ciliary body."],
["ret","Retina","Inner layer containing photoreceptors (rods and cones), bipolar cells and ganglion cells."],
["fov","Fovea (yellow spot)","Central pit of the macula lutea with only cones; point of sharpest vision."],
["bs","Blind spot","Region where nerve fibres leave the retina; no rods or cones, so no image is formed."],
["on","Optic nerve","Carries impulses from the retina to the brain."],
["ln","Lens","Transparent biconvex structure held by ligaments; changes shape to focus (accommodation)."],
["ir","Iris","Pigmented, contractile diaphragm that gives the eye its colour and controls the size of the pupil."],
["pu","Pupil","Central opening of the iris through which light enters."],
["cb","Ciliary body","Muscles and ligaments that hold the lens and alter its curvature."],
["aq","Aqueous humour","Thin watery fluid in the space between the cornea and the lens."],
["vit","Vitreous humour","Transparent jelly-like fluid behind the lens that maintains the shape of the eyeball."]]}
];

const $ = id => document.getElementById(id);
let mix = false, di = 0, mode = "learn", cur = null, answered = false;
const sc = {c: 0, n: 0, k: 0};
const shuf = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const P = id => D[di].parts.find(p => p[0] === id);

function tabs(){
  $("dtabs").innerHTML = "";
  D.forEach((d, i) => {
    const b = document.createElement("button"); b.textContent = d.t;
    b.className = i === di ? "on" : ""; b.onclick = () => { di = i; show(); }; $("dtabs").appendChild(b);
  });
}
function draw(){
  tabs();
  const d = D[di];
  $("chap").textContent = d.ch;
  $("svgbox").innerHTML = '<svg viewBox="' + d.vb + '">' + d.svg + "</svg>";
  $("stage").classList.toggle("quiz", mode === "quiz");
  document.querySelectorAll(".part").forEach(g => g.onclick = () => { if (mode === "learn") learn(g.dataset.p); });
}
function show(){ draw(); mode === "learn" ? learnHome() : nextQ(); }
function hl(id){
  document.querySelectorAll(".part").forEach(g => g.classList.toggle("hl", g.dataset.p === id));
}
function learnHome(){
  hl(null);
  $("side").innerHTML = '<p class="mut">Tap any part of the diagram, or a name below, to see what it is and the facts NEET asks about it.</p><div class="chips" id="chips"></div>';
  D[di].parts.forEach(p => {
    const b = document.createElement("button"); b.textContent = p[1]; b.onclick = () => learn(p[0]); $("chips").appendChild(b);
  });
}
function learn(id){
  const p = P(id); hl(id);
  $("side").innerHTML = '<h3>' + p[1] + '</h3><p>' + p[2] + '</p><button id="bk">All parts</button>';
  $("bk").onclick = learnHome;
}
function nextQ(){
  answered = false;
  if (mix && mode === "quiz") { const nd = Math.floor(Math.random() * D.length); if (nd !== di) { di = nd; draw(); } }
  hl(null);
  const parts = D[di].parts;
  cur = parts[Math.floor(Math.random() * parts.length)];
  const byFact = Math.random() < 0.4;
  const opts = shuf([cur].concat(shuf(parts.filter(p => p !== cur)).slice(0, 3)));
  let h = '<p class="q">' + (byFact ? "Which part is described here?<br><span style='font-weight:400'>" + cur[2] + "</span>" : "Name the part glowing in orange.") + "</p>";
  if (!byFact) hl(cur[0]);
  $("side").innerHTML = h + '<div id="opts"></div><div id="res"></div>';
  opts.forEach(o => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = o[1];
    b.onclick = () => answer(o, b); $("opts").appendChild(b);
  });
}
function answer(o, b){
  if (answered) return; answered = true;
  const ok = o === cur; sc.n++; if (ok) sc.c++;
  sc.k = ok ? sc.k + 1 : 0;
  [...$("opts").children].forEach(x => { if (x.textContent === cur[1]) x.classList.add("right"); });
  if (!ok) b.classList.add("wrong");
  hl(cur[0]);
  $("res").innerHTML = '<div class="fb" style="background:' + (ok ? "var(--ok)" : "var(--no)") + '">' +
    (ok ? "Correct!" : "Not quite. It is the " + cur[1] + ".") + "</div><p>" + cur[2] + '</p><button id="nx" class="on">Next question</button>';
  $("nx").onclick = nextQ;
  $("score").textContent = "Score: " + sc.c + "/" + sc.n + " · streak " + sc.k;
}
function setMode(m){
  mode = m;
  $("mLearn").classList.toggle("on", m === "learn");
  $("mQuiz").classList.toggle("on", m === "quiz");
  show();
}
$("mLearn").onclick = () => setMode("learn");
$("mQuiz").onclick = () => setMode("quiz");
$("mix").onchange = e => { mix = e.target.checked; if (mode === "quiz") nextQ(); };
show();
</script>
</body>
</html>
